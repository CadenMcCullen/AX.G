name: Secret Scanner

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Secrets
        run: |
          echo "Scanning for hardcoded API keys, private keys, or credentials..."
          # Real grep command to detect suspicious variables resembling secrets
          ! git grep -E "(SECRET_KEY|PASSWORD|API_KEY|PRIVATE_KEY)\s*=\s*['\"][a-zA-Z0-9+=/]{16,}['\"]" -- '*.py'
