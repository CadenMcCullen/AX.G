name: CI Pipeline

on:
  push:
    branches: [ main, "jules-*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic uvicorn httpx

      - name: Run Unit Tests
        run: |
          python -m pytest tests/
